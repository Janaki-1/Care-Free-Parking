<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Parking - Smart Parking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">Smart Parking</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto" id="navLinks"></ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="text-center">Find Parking</h2>
    <div class="mx-auto mt-4" style="max-width: 500px;">
      <input type="text" id="searchParking" class="form-control" placeholder="Enter location or parking name">
      <ul id="suggestions" class="list-group mt-2"></ul>
    </div>
  </div>

  <!-- Payment Modal -->
  <div class="modal fade" id="paymentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Payment</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="paymentForm">
            <div class="mb-3">
              <label class="form-label">Payment Method</label>
              <select id="paymentMethod" class="form-select" required>
                <option value="">Select</option>
                <option value="card">Credit/Debit Card</option>
                <option value="upi">Google Pay / UPI</option>
              </select>
            </div>

            <div id="cardDetails" style="display:none;">
              <div class="mb-3">
                <label>Card Number</label>
                <input type="text"
